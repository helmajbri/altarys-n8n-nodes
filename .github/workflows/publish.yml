# Publishes one node package to npm with a provenance statement, then scans the published version.
#
# Based on the publish.yml that `npm create @n8n/node` writes (n8n-nodes-starter). Differences:
# this repository holds several packages, so the tag names the package ("letzbill-v0.1.0"), and
# the community-package scan runs here, after the publish, because the scanner only reads a
# version that is already on npm with provenance, and exits 0 even when the scan fails.
#
# GitHub-hosted runners only: npm provenance and trusted publishing do not support self-hosted
# runners. Authentication: npm trusted publishing (OIDC) once the package exists; the first
# version of a package is published with an NPM_TOKEN secret, which is then removed. Configure
# the trusted publisher on npmjs.com with the workflow file name "publish.yml".
#
# Gates: the publish job runs in the "npm-publish" environment (its required reviewers approve
# each release), and only for a tag whose commit is already on main.
#
# Release: in packages/<name>, run `npm run release`. It bumps the version, commits, and pushes
# the tag "<name>-v<version>" (see .release-it.json), which starts this workflow. Each package has
# its own tag prefix (letzbill-v, letzcloud-v) and is published on its own.

name: Publish

on:
  push:
    tags:
      - 'letzbill-v*.*.*'
      - 'letzcloud-v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      # Required to mint an OIDC token for the npm provenance attestation.
      id-token: write
      contents: read

    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish"
            exit 1
          fi

      - name: Set up Node.js
        # registry-url writes an .npmrc that reads the token from NODE_AUTH_TOKEN; with no token
        # set, npm uses trusted publishing (OIDC).
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: npm with trusted publishing support (11.5.1 or later)
        run: npm install -g npm@11.6.2

      - name: Resolve the package from the tag
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir="packages/${TAG%%-v*}"
          version="${TAG##*-v}"
          test -f "$dir/package.json" || { echo "No package for tag $TAG"; exit 1; }
          name=$(node -p "require('./$dir/package.json').name")
          declared=$(node -p "require('./$dir/package.json').version")
          if [ "$declared" != "$version" ]; then
            echo "Tag version $version does not match $dir/package.json version $declared"
            exit 1
          fi
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies (lockfile required)
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm ci

      - name: Guard, generated operations, build and tests
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          npm run guard
          npm run generate:check
          npm run build
          npm test

      - name: Release
        # n8n-node release, inside GitHub Actions, lints, builds and runs npm publish with
        # NPM_CONFIG_PROVENANCE=true. Leave the NPM_TOKEN secret unset to use trusted publishing.
        working-directory: ${{ steps.package.outputs.dir }}
        # With the secret set, it becomes the token setup-node's .npmrc reads; without it, the
        # placeholder setup-node exports stays and npm uses OIDC, as in npm's own example.
        run: |
          if [ -n "$NPM_TOKEN" ]; then export NODE_AUTH_TOKEN="$NPM_TOKEN"; fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  scan:
    name: Community package scan
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SPEC: ${{ needs.publish.outputs.name }}@${{ needs.publish.outputs.version }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24, not lts/*: the scanner 0.42.0 depends on isolated-vm 6.2.0, which does not
          # compile on Node 26, so npx exits 1 without running the scan.
          node-version: '24'

      - name: Wait until the version can be downloaded
        # npm lists a new version minutes before its tarball can be downloaded ("Your package is
        # being processed"), and the scanner downloads it, so wait for the tarball itself.
        run: |
          for attempt in $(seq 1 45); do
            tarball=$(npm view "$SPEC" dist.tarball 2>/dev/null || true)
            if [ -n "$tarball" ] && curl -fsS -o /dev/null "$tarball"; then exit 0; fi
            sleep 20
          done
          echo "$SPEC could not be downloaded from the registry"
          exit 1

      - name: Scan the published version
        # The scanner prints its verdict and exits 0 on a failed scan, so the output decides.
        run: |
          npx --yes @n8n/scan-community-package@0.42.0 "$SPEC" 2>&1 | tee scan.log
          if ! grep -F "Package $SPEC has passed all security checks" scan.log; then
            echo "::error::No passing verdict for $SPEC. A log without a verdict line means the scanner did not start."
            exit 1
          fi

      - name: Keep the scan output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: community-package-scan
          path: scan.log
