# Publishes one node package to npm with a provenance statement, then scans the published version.
#
# Based on the publish.yml that `npm create @n8n/node` writes (n8n-nodes-starter). Differences:
# this repository holds several packages, so the tag names the package ("letzbill-v0.1.0"), and
# the community-package scan runs here, after the publish, because the scanner only reads a
# version that is already on npm with provenance, and exits 0 even when the scan fails.
#
# GitHub-hosted runners only: npm provenance and trusted publishing do not support self-hosted
# runners. Authentication: npm trusted publishing (OIDC) once the package exists; the first
# version of a package is published with an NPM_TOKEN repository secret, which is then removed.
# Configure the trusted publisher on npmjs.com with the workflow file name "publish.yml".
#
# Release: in packages/<name>, run `npm run release`. It bumps the version, commits, and pushes
# the tag "<name>-v<version>" (see .release-it.json), which starts this workflow.

name: Publish

on:
  push:
    tags:
      - 'letzbill-v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for the npm provenance attestation.
      id-token: write
      contents: read

    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: npm with trusted publishing support (11.5.1 or later)
        run: npm install -g npm@11.6.2

      - name: Resolve the package from the tag
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir="packages/${TAG%%-v*}"
          version="${TAG##*-v}"
          test -f "$dir/package.json" || { echo "No package for tag $TAG"; exit 1; }
          name=$(node -p "require('./$dir/package.json').name")
          declared=$(node -p "require('./$dir/package.json').version")
          if [ "$declared" != "$version" ]; then
            echo "Tag version $version does not match $dir/package.json version $declared"
            exit 1
          fi
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies (lockfile required)
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm ci

      - name: Guard, generated operations, build and tests
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          npm run guard
          npm run generate:check
          npm run build
          npm test

      - name: Release
        # n8n-node release, inside GitHub Actions, lints, builds and runs npm publish with
        # NPM_CONFIG_PROVENANCE=true. Leave NPM_TOKEN unset to use trusted publishing (OIDC).
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  scan:
    name: Community package scan
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SPEC: ${{ needs.publish.outputs.name }}@${{ needs.publish.outputs.version }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Wait until the version is on the registry
        run: |
          for attempt in $(seq 1 30); do
            if npm view "$SPEC" version; then exit 0; fi
            sleep 20
          done
          echo "$SPEC did not appear on the registry"
          exit 1

      - name: Scan the published version
        # The scanner prints its verdict and exits 0 on a failed scan, so the output decides.
        run: |
          npx --yes @n8n/scan-community-package@0.42.0 "$SPEC" 2>&1 | tee scan.log
          grep -F "Package $SPEC has passed all security checks" scan.log

      - name: Keep the scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-package-scan
          path: scan.log
