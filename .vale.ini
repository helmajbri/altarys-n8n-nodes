# Prose lint for the user documentation, configured like n8n's own documentation
# (n8n-io/n8n-docs .vale.ini): the Microsoft Writing Style Guide package and Vale's own rules,
# reporting warnings and errors. CI downloads the pinned Vale release and the pinned Microsoft
# package (versions and checksums in .github/workflows/ci.yml) into .vale/styles.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Altarys

[*.md]
BasedOnStyles = Vale, Microsoft
# As in n8n's docs: quotation marks are left to the author.
Microsoft.Quotes = NO
# As in n8n's docs: bold UI labels and link targets are not prose.
TokenIgnores = (\*\*[^*\n]+\*\*), (\]\([^)\n]*\))

# Scoped out, because they are generated tables, not prose:
# - packages/*/docs/operations.md is generated by tools/generate-docs.mjs from the built node.
#   Its tables hold parameter labels, field names and descriptions taken from the node code,
#   which n8n's lint and the no-jargon check already read; prose rules would flag field names
#   and table fragments that are not sentences. CI does not pass this file to Vale.
# - The block between "BEGIN GENERATED: trigger reference" and "END GENERATED" in
#   packages/*/docs/trigger.md is the same kind of generated table (trigger parameters and the
#   event list); the generator wraps it in <!-- vale off --> and <!-- vale on -->.
